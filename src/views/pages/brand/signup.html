<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se | S.O.H.L.O.</title>

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="src/views/styles/shared/navbars.css">
    <link rel="stylesheet" href="src/views/styles/pages/signup.css">
</head>

<body>

    <header>
      
    </header>

   <main class="signup-page">
    <section>
        <h1>Crie sua conta</h1>

        <ol class="signup-progress" aria-label="Etapas do cadastro">
            <li class="active" aria-current="step">
                <span>1</span>
                <span>Dados pessoais</span>
            </li>
            <li>
                <span>2</span>
                <span>Endereço</span>
            </li>
            <li>
                <span>3</span>
                <span data-individual="Plano" data-company="Sobre a empresa">Plano</span>
            </li>
        </ol>

        <!-- Troque a action pelo controller que vai receber o cadastro -->
        <form class="signup-form" id="signup-form" action="index.php?controller=signupController&method=register"
            method="post">

            <!-- ===== ETAPA 1: Dados pessoais ===== -->
            <fieldset>
                <legend>Dados pessoais</legend>

                <fieldset>
                    <legend>Tipo de cliente</legend>
                    <div class="signup-options">
                        <label>
                            <input type="radio" name="customer_type" value="individual" checked required>
                            <span>
                                <strong>Pessoa Física</strong>
                                <small>Para a sua casa</small>
                            </span>
                        </label>
                        <label>
                            <input type="radio" name="customer_type" value="company" required>
                            <span>
                                <strong>Pessoa Jurídica</strong>
                                <small>Para empresas e comércios</small>
                            </span>
                        </label>
                    </div>
                </fieldset>

                <!-- Pessoa Física -->
                <fieldset id="individual-fields">
                    <div class="signup-grid">
                        <div>
                            <label for="full-name">Nome completo</label>
                            <input type="text" id="full-name" name="full_name" autocomplete="name" required>
                        </div>
                        <div>
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00"
                                required>
                        </div>
                    </div>
                </fieldset>

                <!-- Pessoa Jurídica (começa escondida e desativada) -->
                <fieldset id="company-fields" hidden disabled>
                    <div class="signup-grid">
                        <div>
                            <label for="company-name">Razão social</label>
                            <input type="text" id="company-name" name="company_name" autocomplete="organization"
                                required>
                        </div>
                        <div>
                            <label for="trade-name">Nome fantasia</label>
                            <input type="text" id="trade-name" name="trade_name" required>
                        </div>
                        <div>
                            <label for="cnpj">CNPJ</label>
                            <input type="text" id="cnpj" name="cnpj" inputmode="numeric"
                                placeholder="00.000.000/0000-00" required>
                        </div>
                    </div>
                </fieldset>

                <div class="signup-grid">
                    <div>
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div>
                        <label for="phone">Telefone</label>
                        <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel"
                            placeholder="(00) 90000-0000" required>
                    </div>
                    <div>
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" autocomplete="new-password" required>
                    </div>
                    <div>
                        <label for="password-confirm">Confirme a senha</label>
                        <input type="password" id="password-confirm" name="password_confirm"
                            autocomplete="new-password" required>
                    </div>
                </div>
            </fieldset>

            <!-- ===== ETAPA 2: Endereço ===== -->
            <fieldset>
                <legend>Endereço</legend>

                <div class="signup-grid">
                    <div>
                        <label for="zip-code">CEP</label>
                        <input type="text" id="zip-code" name="zip_code" inputmode="numeric"
                            autocomplete="postal-code" placeholder="00000-000" required>
                    </div>
                    <div>
                        <label for="number">Número</label>
                        <input type="text" id="number" name="number" maxlength="10" required>
                    </div>
                    <div>
                        <label for="street">Rua</label>
                        <input type="text" id="street" name="street" autocomplete="address-line1" required>
                    </div>
                    <div>
                        <label for="complement">Complemento (opcional)</label>
                        <input type="text" id="complement" name="complement" autocomplete="address-line2">
                    </div>
                    <div>
                        <label for="neighborhood">Bairro</label>
                        <input type="text" id="neighborhood" name="neighborhood" required>
                    </div>
                    <div>
                        <label for="city">Cidade</label>
                        <input type="text" id="city" name="city" autocomplete="address-level2" required>
                    </div>
                    <div>
                        <label for="state">UF</label>
                        <input type="text" id="state" name="state" maxlength="2" autocomplete="address-level1"
                            placeholder="SP" required>
                    </div>
                </div>
            </fieldset>

            <!-- ===== ETAPA 3: Plano (PF) ou resumo da empresa (PJ) ===== -->
            <fieldset>
                <legend data-individual="Escolha do plano" data-company="Sobre a empresa">Escolha do plano</legend>

                <!-- Pessoa Física -->
                <fieldset id="individual-plan">
                    <fieldset>
                        <legend>Duração</legend>
                        <div class="signup-options">
                            <label>
                                <input type="radio" name="plan_term" value="monthly" required>
                                <span>
                                    <strong>Mensal</strong>
                                    <small>Renova todo mês</small>
                                </span>
                            </label>
                            <label>
                                <input type="radio" name="plan_term" value="annual" required>
                                <span>
                                    <strong>Anual</strong>
                                    <small>Renova uma vez por ano</small>
                                </span>
                            </label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Frequência da coleta</legend>
                        <div class="signup-options">
                            <label>
                                <input type="radio" name="plan_frequency" value="weekly" required>
                                <span>
                                    <strong>Semanal</strong>
                                    <small>Uma coleta por semana</small>
                                </span>
                            </label>
                            <label>
                                <input type="radio" name="plan_frequency" value="biweekly" required>
                                <span>
                                    <strong>Quinzenal</strong>
                                    <small>Uma coleta a cada 15 dias</small>
                                </span>
                            </label>
                        </div>
                    </fieldset>

                    <div class="signup-grid">
                        <div>
                            <label for="collection-day">Dia da coleta</label>
                            <select id="collection-day" name="collection_day" required>
                                <option value="" selected disabled>Selecione</option>
                                <option value="monday">Segunda-feira</option>
                                <option value="tuesday">Terça-feira</option>
                                <option value="wednesday">Quarta-feira</option>
                                <option value="thursday">Quinta-feira</option>
                                <option value="friday">Sexta-feira</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <!-- Pessoa Jurídica (começa escondida e desativada) -->
                <fieldset id="company-summary" hidden disabled>
                    <div class="signup-grid">
                        <div>
                            <label for="company-summary-text">Resumo sobre a empresa</label>
                            <textarea id="company-summary-text" name="company_summary" rows="5" maxlength="1000"
                                placeholder="O que a empresa faz, que tipo de resíduo orgânico gera e o que precisa."
                                required></textarea>
                            <small>O plano é combinado diretamente com a nossa equipe.</small>
                        </div>
                    </div>
                </fieldset>
            </fieldset>

            <!-- Botões -->
            <div class="signup-actions">
                <button type="button" class="btn back" id="signup-back-btn" hidden>Voltar</button>
                <button type="button" class="btn next" id="signup-next-btn">Próximo</button>
                <input type="submit" class="btn next" id="signup-submit-btn" value="Criar Conta" hidden>
            </div>
        </form>

        <p><a class="btn to-login" href="index.php?controller=pagesController&method=initLogin">Já tenho uma conta Húmus</a></p>
    </section>
</main>

    <script src="src/views/scripts/shared/themes.js"></script>
    <script src="src/views/scripts/shared/navbars.js"></script>
    <script src="src/views/scripts/shared/signup.js"></script>
</body>

</html>
