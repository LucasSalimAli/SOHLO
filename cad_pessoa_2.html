<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.O.H.L.O.</title>

    <!--Link para o Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!--Link dos Ícones do Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!--Link das Fontes (Science Gothic)-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap" rel="stylesheet">

    <!--Link Css Custom-->
    <link rel="stylesheet" href="css/cad.css">

    <script src="js/theme.js" defer></script>

</head>


<body>

    <header>

        <div class="container-flex">
            <nav class="navbar navbar-expand-lg rounded navbar_std">

                <div class="container">
                    <div class="collapse navbar-collapse d-lg-flex">
                        <a class="navbar-brand logo" href="#">Húmus - Compostagem</a>
                    </div>

                </div>
            </nav>
        </div>

    </header>


    <main class="container">
        <h1>Cadastrar-se</h1>

        <div class="form-wrapper">
            <section class="info-box">
                <h3 class="card-title info-card-title">Passo 2 - Endereço</h3>
                <hr class="divider">
                <div class="info-text">
                    <p >Estamos quase lá!</p>
                    <p>Agora, nos infome seu endereço.</p>
                    <p>Os campos marcados em * são opcionais.</p>
                </div>
            </section>

            <section class="form-box">
                <h3 class="section-title info-card-title">Endereço</h3>

                <form action="#" method="POST">
                    <div class="form-grid">
                        <div class="input-group">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" name="cidade"  required>
                        </div>

                        <div class="input-group">
                            <label for="estado">Estado</label>
                            <input type="text" id="estado" name="estado">
                        </div>

                        <div class="input-group">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep" required>
                        </div>

                        <div class="input-group">
                            <label for="rua">Rua</label>
                            <input type="rua" id="rua" name="rua" required>
                        </div>

                        <div class="input-group">
                            <label for="bairro">Bairro</label>
                            <input type="bairro" id="bairro" name="bairro" required>
                        </div>

                        <div class="input-group">
                            <label for="numero">Número</label>
                            <input type="num" id="numero" name="numero">
                        </div>

                        <div class="input-group">
                            <label for="complemento">Complemento</label>
                            <input type="complemneto" id="complemento" name="complemento" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a href="index.html" class="btn btn-primary btn-custom btn-back">Cancelar</a>
                        <a href="cad_pessoa_3.html" class="btn btn-primary btn-custom btn-next">Próxima Página</a>
                    </div>
                </form>
            </section>
        </div>
    </main>

</body>

</html>
